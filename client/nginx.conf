server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the api service on the compose network (same origin, so no CORS needed)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # $http_host keeps the port the client used (e.g. localhost:8080), so URLs the API builds
        # from the Host header, like the Location of a created order, point back here (#48).
        # $host would drop the port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback so Vue Router history-mode routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
